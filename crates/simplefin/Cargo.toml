[package]
name = "simplefin"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
db = { path = "../db" }
extractor = { path = "../extractor" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
